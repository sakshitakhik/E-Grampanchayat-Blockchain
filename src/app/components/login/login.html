<div class="user-auth-container py-5 mt-5">
    <div class="row justify-content-center pt-4">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-dark p-4 text-center text-white">
                    <i class="bi bi-box-arrow-in-right display-4 text-warning"></i>
                    <h2 class="fw-bold mb-0 mt-2">Login</h2>
                    <p class="text-white-50 mb-0">Access your village dashboard</p>
                </div>
                <div class="card-body p-5">
                    <div *ngIf="errorMsg" class="alert alert-danger mb-4 rounded-3 d-flex align-items-center">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        {{errorMsg}}
                    </div>

                    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Login As</label>
                            <div class="d-flex gap-2">
                                <input type="radio" class="btn-check" formControlName="selectedRole" value="Citizen" id="login-citizen">
                                <label class="btn btn-outline-primary flex-fill rounded-pill" for="login-citizen">Citizen</label>

                                <input type="radio" class="btn-check" formControlName="selectedRole" value="Gramsevak" id="login-gramsevak">
                                <label class="btn btn-outline-primary flex-fill rounded-pill" for="login-gramsevak">Gramsevak</label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control bg-light border-0 py-2" 
                                    formControlName="email" placeholder="name@example.com">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control bg-light border-0 py-2" 
                                    formControlName="password" placeholder="••••••••">
                            </div>
                        </div>

                        <div class="d-grid mt-5">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold" 
                                [disabled]="loginForm.invalid || isLoading">
                                <span *ngIf="!isLoading">Sign In</span>
                                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted">Don't have an account? 
                            <a routerLink="/signup" class="text-primary fw-bold text-decoration-none">Create Account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
