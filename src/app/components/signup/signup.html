<div class="user-auth-container py-5 mt-5">
    <div class="row justify-content-center pt-4">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-dark p-4 text-center text-white">
                    <i class="bi bi-person-plus display-4 text-warning"></i>
                    <h2 class="fw-bold mb-0 mt-2">Sign Up</h2>
                    <p class="text-white-50 mb-0">Join your digital village community</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <div *ngIf="errorMsg" class="alert alert-danger mb-4 rounded-3 d-flex align-items-center">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        {{errorMsg}}
                    </div>

                    <form [formGroup]="signupForm" (ngSubmit)="onSignup()">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Sign Up As</label>
                            <div class="d-flex gap-2">
                                <input type="radio" class="btn-check" formControlName="role" value="Citizen" id="role-citizen">
                                <label class="btn btn-outline-primary flex-fill rounded-pill" for="role-citizen">Citizen</label>

                                <input type="radio" class="btn-check" formControlName="role" value="Gramsevak" id="role-gramsevak">
                                <label class="btn btn-outline-primary flex-fill rounded-pill" for="role-gramsevak">Gramsevak</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" class="form-control bg-light border-0 py-2" formControlName="name" placeholder="John Doe">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control bg-light border-0 py-2" formControlName="email" placeholder="name@example.com">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Password</label>
                                <input type="password" class="form-control bg-light border-0 py-2" formControlName="password" placeholder="••••••••">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Phone Number</label>
                                <input type="text" class="form-control bg-light border-0 py-2" formControlName="phone" placeholder="+91 0000000000">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Physical Address</label>
                            <textarea class="form-control bg-light border-0" formControlName="address" rows="2" placeholder="Street, Ward No, Village"></textarea>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold" [disabled]="signupForm.invalid || isLoading">
                                <span *ngIf="!isLoading">Create Account</span>
                                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted">Already have an account? 
                            <a routerLink="/login" class="text-primary fw-bold text-decoration-none">Sign In</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
