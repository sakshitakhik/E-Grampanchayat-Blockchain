<div class="container py-5 mt-4">
    <div class="row align-items-center mb-5">
        <div class="col-lg-6">
            <h1 class="fw-bold"><i class="bi bi-megaphone-fill text-danger"></i> Village Announcements</h1>
            <p class="text-muted lead">Stay updated with the latest news and notices from your Grampanchayat.</p>
        </div>
        <div class="col-lg-6 text-lg-end">
            <span class="badge bg-danger rounded-pill px-3 py-2">LIVE UPDATES</span>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4" *ngFor="let item of announcements">
            <div class="card announcement-card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="position-absolute top-0 end-0 p-3">
                    <span class="priority-badge" [ngClass]="item.priority.toLowerCase()">{{item.priority}}</span>
                </div>
                <div class="card-body p-4 pt-5">
                    <div class="date-chip mb-3">{{item.date}}</div>
                    <h4 class="card-title fw-bold mb-3">{{item.title}}</h4>
                    <p class="card-text text-muted">{{item.content}}</p>
                </div>
            </div>
        </div>

        <div *ngIf="isLoading" class="text-center py-5">
            <div class="spinner-grow text-primary" role="status"></div>
            <p class="mt-3 text-muted">Fetching latest notices...</p>
        </div>

        <div *ngIf="!isLoading && announcements.length === 0" class="text-center py-5">
            <p class="text-muted">No recent announcements found.</p>
        </div>
    </div>
</div>
