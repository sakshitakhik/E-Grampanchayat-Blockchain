<div class="container py-5 mt-4">
    <div class="header-section text-center mb-5">
        <h2 class="fw-bold"><i class="bi bi-box-seam text-primary"></i> Citizen Polls & Votes</h2>
        <p class="text-muted">Your opinion matters for our village's growth.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div *ngFor="let poll of polls" class="card shadow-sm border-0 rounded-4 mb-4 fade-in">
                <div class="card-body p-4 p-lg-5">
                    <h4 class="card-title fw-bold mb-4">{{poll.question}}</h4>
                    
                    <div class="poll-options" *ngIf="!votedPolls.has(poll.id)">
                        <button *ngFor="let option of poll.options; let i=index" 
                                class="btn btn-outline-primary w-100 mb-3 py-3 rounded-3 text-start d-flex justify-content-between align-items-center"
                                (click)="onVote(poll.id, i)">
                            <span>{{option}}</span>
                            <i class="bi bi-circle"></i>
                        </button>
                    </div>

                    <div *ngIf="votedPolls.has(poll.id)" class="text-center py-3 bg-light rounded-3">
                        <i class="bi bi-check-circle-fill text-success fs-2 d-block mb-2"></i>
                        <h5 class="fw-bold text-success">Vote Recorded!</h5>
                        <p class="text-muted small">Thank you for participating in this poll.</p>
                    </div>
                </div>
            </div>

            <div *ngIf="polls.length === 0" class="text-center py-5">
                <i class="bi bi-clipboard-x text-muted display-1"></i>
                <h4 class="mt-4 text-muted">No active polls at the moment.</h4>
            </div>
        </div>
    </div>
</div>
